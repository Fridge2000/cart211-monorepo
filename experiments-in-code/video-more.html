<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Video More</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif; 
            margin: 20px;
        }
        /* VIDEO SIZE BUTTONS */
        /* Add space below the group of buttons */
        .size-controls {
            margin-bottom: 15px;
        }

        /* Style all buttons inside the size-controls sections */
        .size-controls button {
            /* add space inside each button */
            padding: 8px 14px;
            /* add space between buttons */
            margin: 3px;
            /* change cursor shape to a hand */
            cursor: pointer;
        }

        /* VIDEO SIZE CONTROl */

        /* Applies these style to the video player */
        /* mostly related to size */
        video {
            display: block;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            
            /* Makes changes in the video appear smoothly */
            transition: width 0.3s ease;
        }

        /* DIFFERENT VIDEO SIZES */
        video.small {
            width: 320px;
        }
        video.medium {
            width: 480px;
        }
        video.large {
            width: 720px;
        }
        video.full {
            width: 100%
        }
    </style>
</head>
<body>
    <h1>Cat Video</h1>
    <p>Look at this creature</p>

    <!-- size control buttons -->
    <div class="size-controls">
        <!-- Tells visitors what the buttons controls  -->
        <strong>Video Size: </strong>

        <!-- when clicked, calls the javascript function and changes the video with to 320px -->
        <button onclick="changeSize('small')">Small</button>

        <!-- Change width to 480px -->
        <button onclick="changeSize('medium')">Medium</button>

        <!-- Change width to 720px -->
        <button onclick="changeSize('large')">Large</button>

        <!-- Change width to available content width -->
        <button onclick="changeSize('full')">Full</button>

    </div>

    <!-- VIDEO PLAYER -->
    <!-- id="myVideo" gives the video a unique name that JS can select -->
    <!-- class="full" makes the video start at full width -->
    <!-- controls displays the built-in play, pause, volume and other controls -->
    <video id="myVideo" class="full" controls>
        <source src="cat-nap.mp4" type="video/mp4">
        Sorry, your browser cannot play this video. Try on Firefox or Chrome.
    </video>
    
    <!-- JAVASCRIPT: CHANGE VIDEO SIZE -->
    <script>
        // this function runs whenever a size button is clicked
        // the word "size" receives the value from the button
        // such as "small", "medium", "large" or "full"
        function changeSize(size){
            // get the video with getElementById
            const myVideo = document.getElementById('myVideo');
            // mods the class
            myVideo.className = size;
        }
    </script>
</body>
</html>
