<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Video</title>
    <style>
        /* Removes the default spacing and makes the page fill the screen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Sets the main page dimensions and default font */
        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: white;
            background-color: black;
        }

        /* Positions the video behind entire page */
        .background-video {
            position: fixed;
            /* keep vid fixed to viewport */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            /* fills screen without stretching */
            object-fit: cover;
            /* keeps obj centered */
            object-position: center;
            /* sets "layer" of image, places video behind the content */
            z-index: -1;
        }
        
        /* adds a dark overlay to make text easier to read */
        .overlay{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            /* last value controls darknes: 0 is transparent, 1 is opaque */
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }
        
        /* Position the website content above the video and overlay */
        .content {
            position: relative;
            z-index: 1;

            min-height: 100vh;
            display: flex;
            flex-direction: column;

            /* centers content vertically */
            justify-content: center;

            /* centers content horizontally */
            align-items: center;
        }
        h1{
            /* rem = font size of root elem, usually 16px */
            /* 5vw = 5% of viewport width */
            /* clamp: minimum size, prefered size, maximum size */
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 15px;
        }
        p {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <!-- BG VIDEO THAT PLAYS AUTOMATICALLY AND REPEATS -->
    <video class="background-video" autoplay muted loop playsinline aria-hidden="true" tabindex="-1">
        <source src="cat-nap.mp4" type="video/mp4">
        Sorry, your browser cannot play this video. Try on Firefox or Chrome.
    </video>
    <!-- Darkens the BG video so that the text is visible -->
    <div class="overlay"></div>

    <main class="content">
        <h1>How to Lick Your Cat</h1>
        <p>Your feline companion would greatly appreciate it if you would help them groom themselves</p>
    </main>
</body>
</html>
